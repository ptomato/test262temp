name: Engine tests

on:
  pull_request:

jobs:
  changed-tests:
    name: Identify changed tests
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed.outputs.any_changed }}
      all_changed_files: ${{ steps.changed.outputs.all_changed_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Identify new or changed tests
        id: changed
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: test/

  engine-tests:
    name: ${{ matrix.engine.name }}
    needs: changed-tests
    if: needs.changed-tests.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine:
          - { name: 'V8', key: 'v8', hostType: 'd8', hostPath: 'v8', hostName: 'v8' }
          - { name: 'V8 --harmony', key: 'v8-harmony', hostType: 'd8', hostPath: 'v8', hostName: 'v8', hostArgs: '--harmony' }
          - { name: 'SpiderMonkey', key: 'spidermonkey', hostType: 'jsshell', hostPath: 'spidermonkey', hostName: 'spidermonkey' }
          - { name: 'JSC', key: 'jsc', hostType: 'jsc', hostPath: 'javascriptcore', hostName: 'javascriptcore' }
          - { name: 'XS', key: 'xs', hostType: 'xs', hostPath: 'xs', hostName: 'xs' }
          - { name: 'engine262', key: 'engine262', hostType: 'engine262', hostPath: 'engine262', hostName: 'engine262', hostArgs: '--features=all' }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set LANG for JSC
        if: matrix.engine.key == 'jsc'
        run: echo 'LANG=C' >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install engine
        run: ./node_modules/.bin/esvu install ${{ matrix.engine.hostName }}

      - name: Run changed tests
        run: |
          hostPath="$HOME/.esvu/bin/${{ matrix.engine.hostPath }}"
          ./node_modules/.bin/test262-harness \
            -t 1 \
            --hostType="${{ matrix.engine.hostType }}" \
            --hostPath="$hostPath" \
            --hostArgs="${{ matrix.engine.hostArgs }}" \
            --reporter json \
            -- ${{ needs.changed-tests.outputs.all_changed_files }} \
            > "results-${{ matrix.engine.key }}.json"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: results-${{ matrix.engine.key }}.json
          if-no-files-found: ignore
          archive: false
